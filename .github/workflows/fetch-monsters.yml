name: Fetch monster assets
on:
  push:
    branches: [fetch-assets]
  schedule:
    - cron: "17 */2 * * *"   # retry every 2 hours until Google Drive allows the download
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fetch-assets
      - name: Stop if assets were already fetched
        id: check
        run: |
          if git ls-remote --exit-code origin refs/heads/monster-assets > /dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"; echo "Already fetched."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download only the glTF files (Quaternius Ultimate Monsters, CC0)
        if: steps.check.outputs.done == 'false'
        run: |
          pip install --quiet gdown
          python - <<'PY'
          import gdown, os, sys
          url = "https://drive.google.com/drive/folders/18m4KpzpEzhC9wl7jzr6dUc0N8Jozr79C"
          files = gdown.download_folder(url, output="raw", skip_download=True, quiet=True)
          want = [f for f in files if "/glTF/" in f.path.replace(os.sep, "/") and f.path.lower().endswith((".gltf", ".png", ".bin"))]
          print("glTF files listed:", len(want))
          ok = 0
          for f in want:
              os.makedirs(os.path.dirname(f.local_path), exist_ok=True)
              try:
                  if gdown.download(id=f.id, output=f.local_path, quiet=True):
                      ok += 1
              except Exception as e:
                  print("FAILED", f.path, str(e).splitlines()[0])
          print(f"downloaded {ok}/{len(want)}")
          open("ok_count", "w").write(str(ok))
          sys.exit(0 if ok == len(want) and ok > 0 else 1)
          PY
      - name: Save to branch monster-assets
        if: steps.check.outputs.done == 'false'
        run: |
          mkdir -p monsters && cp -r raw/* monsters/
          find monsters -type f > monsters/FILELIST.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan monster-assets
          git rm -rf --cached . > /dev/null
          git add monsters
          git commit -m "Monster glTF assets from Quaternius Ultimate Monsters (CC0)"
          git push -f origin monster-assets
